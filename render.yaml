databases:
  - name: fuji-flow-db
    databaseName: fuji_flow
    user: fuji_user
    plan: free

services:
  # 1. FastAPI Backend API Service
  - type: web
    name: fuji-flow-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: fuji-flow-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false

  # 2. React + TypeScript Frontend Static Site
  - type: web
    name: fuji-flow-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
